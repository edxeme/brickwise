services:
  db:
    image: pgvector/pgvector:pg16
    container_name: brickwise-db
    environment:
      POSTGRES_USER: brickwise
      POSTGRES_PASSWORD: brickwise
      POSTGRES_DB: brickwise
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brickwise"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
