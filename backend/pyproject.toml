[project]
name = "brickwise-backend"
version = "0.1.0"
description = "Evaluación de factibilidad de proyectos de construcción"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "strawberry-graphql[fastapi]>=0.250",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.28",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "shapely>=2.0",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
